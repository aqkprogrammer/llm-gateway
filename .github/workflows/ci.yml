name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Dashboard is up to date
        run: |
          uv run python scripts/build_dashboard.py
          git diff --exit-code deploy/grafana/dashboards/

      - name: Tests
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name gw -p 8080:8080 \
            -e GATEWAY_REDIS_URL=redis://127.0.0.1:1/0 llm-gateway:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health/live && exit 0
            sleep 1
          done
          docker logs gw
          exit 1
