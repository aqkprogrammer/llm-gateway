global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: llm-gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
